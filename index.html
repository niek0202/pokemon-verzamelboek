<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161c4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Verzamelboek">
<title>Verzamelboek</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%92%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{
  --page:#dcebff; --page2:#f3e9ff; --sleeve:#ffffff; --ink:#18204a; --soft:#56608c; --line:#bccbe8;
  --night:#161c4a; --night2:#2a2f86; --gold:#ffcb3d; --gold-d:#d99a0b; --ok:#2fae6a; --ok-d:#1d7a48;
  --pink:#ff6fb5; --cyan:#36d6e7;
  --empty:#2a3478; --shadow:0 3px 0 rgba(22,28,74,.22);
  --holo:linear-gradient(115deg,#7af0ff,#b48cff 30%,#ff8fd0 50%,#ffe47a 70%,#7affc1);
  --disp:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--page:#0f1433;--page2:#1b1240;--sleeve:#1d2556;--ink:#eef2ff;--soft:#a9b2d9;--line:#344080;--empty:#232c66;--shadow:0 3px 0 rgba(0,0,0,.45);color-scheme:dark}
}
:root[data-theme="dark"]{--page:#0f1433;--page2:#1b1240;--sleeve:#1d2556;--ink:#eef2ff;--soft:#a9b2d9;--line:#344080;--empty:#232c66;--shadow:0 3px 0 rgba(0,0,0,.45);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;min-height:100%;color:var(--ink);
  background:
    radial-gradient(circle at 20px 20px,rgba(255,111,181,.16) 0 3px,transparent 4px) 0 0/120px 120px,
    radial-gradient(circle at 80px 70px,rgba(54,214,231,.18) 0 4px,transparent 5px) 0 0/120px 120px,
    radial-gradient(circle at 60px 10px,rgba(255,203,61,.22) 0 2px,transparent 3px) 0 0/90px 90px,
    linear-gradient(180deg,var(--page),var(--page2)) fixed;
  font-family:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:18px;line-height:1.35;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
svg.ti{width:1em;height:1em;fill:currentColor;flex:0 0 auto}
.press{transition:transform .12s ease}
.press:active{transform:scale(.95)}

/* ---------- inlog ---------- */
.gate{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;
  background:radial-gradient(circle at 15% 20%,rgba(255,255,255,.9) 0 1px,transparent 1.5px) 0 0/90px 70px,
             radial-gradient(circle at 60% 70%,rgba(255,255,255,.6) 0 1px,transparent 1.5px) 0 0/130px 90px,
             linear-gradient(180deg,var(--night),var(--night2))}
.gate[hidden]{display:none}
.gate form{width:min(100%,400px);background:var(--sleeve);color:var(--ink);border-radius:26px;padding:26px 22px 22px;box-shadow:0 20px 60px rgba(0,0,0,.45);position:relative}
.gate form::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;border-radius:26px 26px 0 0;background:var(--holo)}
.gate h1{font-family:var(--disp);font-weight:400;font-size:2rem;margin:4px 0 2px;line-height:1.05}
.gate p{margin:0 0 16px;color:var(--soft);font-weight:600}
.gate label{display:block;font-weight:800;margin:12px 2px 6px}
.gate input[type=text],.gate input[type=password]{width:100%;font-size:1.2rem;font-weight:700;padding:12px 14px;border-radius:14px;border:3px solid var(--line);background:var(--page)}
.gate input:focus{border-color:var(--gold);outline:none}
.gate .rem{display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:700;color:var(--soft)}
.gate .rem input{width:22px;height:22px;accent-color:var(--ok)}
.gate .err{color:#d33a4a;font-weight:800;min-height:1.4em;margin:10px 2px 0}
.gate.shake form{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* ---------- kop ---------- */
header.top{position:relative;color:#fff;padding:16px 18px 24px;overflow:hidden;
  background:radial-gradient(circle at 15% 20%,rgba(255,255,255,.9) 0 1px,transparent 1.5px) 0 0/90px 70px,
             radial-gradient(circle at 60% 70%,rgba(255,255,255,.6) 0 1px,transparent 1.5px) 0 0/130px 90px,
             linear-gradient(180deg,var(--night) 0%,var(--night2) 100%)}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--holo);background-size:200% 100%;animation:foil 6s linear infinite}
.wrap{max-width:1180px;margin-left:auto;margin-right:auto}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.title{margin:0;font-family:var(--disp);font-weight:400;font-size:1.35rem;display:flex;align-items:center;gap:8px;min-width:0}
.title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.title svg{color:var(--gold);width:1.2em;height:1.2em}
.hbtns{display:flex;gap:8px}
.iconbtn{background:rgba(255,255,255,.14);border:0;border-radius:12px;padding:6px 12px;color:#fff;font-weight:700;display:flex;align-items:center;gap:6px}
.hero{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-top:8px}
.count{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.count b{font-family:var(--disp);font-weight:400;font-size:4.2rem;line-height:.9;color:var(--gold);text-shadow:0 4px 0 var(--gold-d),0 6px 14px rgba(0,0,0,.35)}
.count span{font-size:1.3rem;font-weight:700}
.rank{margin-left:auto;text-align:right}
.rank strong{display:inline-block;font-family:var(--disp);font-weight:400;font-size:1.05rem;background:rgba(255,255,255,.14);padding:2px 12px;border-radius:999px}
.rank small{display:block;font-size:.95rem;opacity:.85;font-weight:600;margin-top:4px}
.bar{margin-top:14px;height:22px;border-radius:11px;background:rgba(0,0,0,.3);box-shadow:inset 0 2px 0 rgba(0,0,0,.3);overflow:hidden;
  background-image:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),rgba(255,255,255,.12) calc(10% - 2px) 10%)}
.bar i{display:block;height:100%;width:0;border-radius:11px;transition:width .8s cubic-bezier(.2,1.4,.4,1);
  background:linear-gradient(180deg,#ffe58a,var(--gold) 50%,var(--gold-d));box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.status{margin-top:8px;font-size:.85rem;opacity:.7}

/* ---------- navigatie ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--night);border-top:5px solid transparent;border-image:var(--holo) 1;
  padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:4px}
nav.tabs button{flex:1;max-width:180px;border:0;background:transparent;color:#fff;opacity:.65;border-radius:14px;padding:6px 2px;font-weight:700;font-size:.85rem;line-height:1.1}
nav.tabs button[aria-current="page"]{opacity:1;color:var(--gold)}
nav.tabs button svg{display:block;margin:0 auto 2px;width:26px;height:26px}
nav.tabs button.plus svg{background:var(--gold);color:var(--night);border-radius:50%;padding:3px;width:30px;height:30px;margin-top:-2px}

/* ---------- regio-medailles ---------- */
.regions{display:flex;gap:8px;overflow-x:auto;padding:14px 18px 6px;scrollbar-width:none;scroll-snap-type:x proximity}
.regions::-webkit-scrollbar{display:none}
.reg{flex:0 0 auto;scroll-snap-align:start;display:flex;align-items:center;gap:8px;border:3px solid var(--line);background:var(--sleeve);border-radius:16px;padding:6px 12px 6px 8px;text-align:left}
.reg[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,203,61,.35)}
.medal{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-size:.8rem;color:#fff;background:conic-gradient(var(--mc) calc(var(--p)*1%),var(--line) 0);position:relative}
.medal::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--mi)}
.medal span{position:relative}
.reg strong{display:block;font-family:var(--disp);font-weight:400;font-size:1.05rem;line-height:1.1}
.reg em{font-style:normal;font-size:.85rem;color:var(--soft);font-weight:600}

main{padding:6px 14px calc(130px + var(--trayh,0px))}
.view[hidden]{display:none}
h2{font-family:var(--disp);font-weight:400;font-size:1.8rem;margin:18px 4px 6px}
.hint{color:var(--soft);margin:0 4px 14px;font-size:1rem;font-weight:600}

/* ---------- verzamelmap ---------- */
.sheet{background:linear-gradient(180deg,var(--night2),var(--night));border-radius:22px;padding:0 12px 12px;margin-bottom:20px;box-shadow:var(--shadow);overflow:hidden}
.sheet h3{color:#fff;margin:0 -12px 12px;padding:10px 18px;font-family:var(--disp);font-weight:400;font-size:1.4rem;display:flex;justify-content:space-between;align-items:baseline;
  background:linear-gradient(90deg,var(--rc),transparent 85%)}
.sheet h3 span{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1rem;color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.slot{position:relative;aspect-ratio:63/88;border-radius:11px;border:0;padding:0;text-align:left;overflow:hidden;
  content-visibility:auto;contain-intrinsic-size:108px 150px;transform:perspective(600px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s ease}
.slot.back{background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 6px,transparent 6px 12px),radial-gradient(circle at 50% 46%,#3a46a0 0 28%,transparent 29%),var(--empty);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.12);color:rgba(255,255,255,.55);display:flex;flex-direction:column;justify-content:space-between;padding:7px}
.slot.back .q{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) rotate(45deg);width:38%;aspect-ratio:1;border-radius:8px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 2px rgba(255,203,61,.45);display:grid;place-items:center}
.slot.back .q b{transform:rotate(-45deg);font-family:var(--disp);font-weight:400;font-size:1.6rem;color:var(--gold);opacity:.75}
.slot.back .no{font-weight:700;font-size:.8rem;position:relative}
.slot.back .nm{font-weight:700;font-size:.85rem;line-height:1.1;position:relative;word-break:break-word}
.slot.has{background:var(--t1);padding:5px;box-shadow:0 3px 0 rgba(0,0,0,.35);color:#18204a}
.slot.has .inner{position:absolute;inset:5px;border-radius:7px;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(170deg,rgba(255,255,255,.92),rgba(255,255,255,.72)),var(--t2)}
.slot.has .row{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 0;font-weight:800;font-size:.78rem}
.slot.has .row .ics{display:flex;gap:2px}
.slot.has .row .ics span{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px}
.slot.has .art{flex:1;margin:4px 6px;border-radius:5px;display:grid;place-items:center;color:rgba(255,255,255,.95);font-size:2.4rem;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.35),transparent 60%),linear-gradient(160deg,var(--t1),var(--t2))}
.slot.has .nm{font-family:var(--disp);font-weight:400;font-size:.98rem;line-height:1.05;padding:0 6px 3px;word-break:break-word}
.slot.photo{background:#0d1230;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.slot.photo img{width:100%;height:100%;object-fit:cover;display:block}
.slot .tags{position:absolute;left:8px;right:8px;top:28px;display:flex;flex-wrap:wrap;gap:3px;pointer-events:none}
.slot.photo .tags{top:6px;left:6px}
.tag{font-size:.7rem;font-weight:800;padding:0 6px;border-radius:6px;background:#18204a;color:#fff;line-height:1.55;box-shadow:0 1px 0 rgba(0,0,0,.3)}
.tag.ir{background:linear-gradient(135deg,#ffe27a,#f2a900);color:#18204a}
.tag.sir{background:linear-gradient(135deg,#ff8fd0,#b48cff,#7af0ff);color:#18204a}
.tag.cnt{position:absolute;right:6px;bottom:6px;background:var(--gold);color:#18204a}
.slot.shine::after{content:"";position:absolute;inset:0;background:var(--holo);background-size:250% 250%;mix-blend-mode:soft-light;opacity:.55;animation:foil 4s linear infinite;pointer-events:none}
@keyframes foil{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.slot.pop{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.12) rotate(-2deg)}100%{transform:scale(1)}}

/* ---------- zoeken ---------- */
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:12px 0;background:linear-gradient(180deg,var(--page) 70%,transparent)}
.search input{width:100%;font-size:1.5rem;font-weight:700;padding:14px 18px;border-radius:18px;border:4px solid var(--night2);background:var(--sleeve);box-shadow:var(--shadow)}
.search input:focus{border-color:var(--gold);outline:none}
.results{display:grid;gap:8px}
.res{display:flex;align-items:center;gap:12px;border:0;border-radius:16px;padding:10px 14px;background:var(--sleeve);box-shadow:var(--shadow);text-align:left;font-family:var(--disp);font-size:1.35rem}
.res .dot{width:42px;height:42px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:1.4rem;background:linear-gradient(160deg,var(--t1),var(--t2))}
.res small{font-family:"Baloo 2",sans-serif;font-size:.9rem;color:var(--soft);font-weight:700;margin-left:auto;text-align:right}
.res .own{font-size:.8rem;background:var(--ok);color:#fff;border-radius:8px;padding:0 8px;font-family:"Baloo 2",sans-serif;font-weight:800}
.empty{padding:28px 10px;text-align:center;color:var(--soft);font-weight:700}

/* ---------- paneel ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,11,32,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.panel{background:var(--page);width:100%;max-width:640px;max-height:94%;overflow:auto;overscroll-behavior:contain;border-radius:24px 24px 0 0;padding:0 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.phead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;margin:0 -18px 6px;padding:14px 18px;color:#fff;background:linear-gradient(160deg,var(--t1),var(--t2));border-radius:24px 24px 0 0}
.phead .badge{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:1.9rem;flex:0 0 auto}
.phead h3{margin:0;font-family:var(--disp);font-weight:400;font-size:1.85rem;line-height:1.05;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.phead p{margin:0;font-size:.95rem;font-weight:700;opacity:.92}
.close{margin-left:auto;border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:12px;width:44px;height:44px;font-size:1.4rem;font-weight:800;flex:0 0 auto}
.pcols{display:block}
.label{font-family:var(--disp);font-size:1.15rem;margin:16px 2px 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:3px solid var(--line);background:var(--sleeve);border-radius:14px;padding:7px 14px;font-weight:800;font-size:1.1rem;min-width:56px}
.chip[aria-pressed="true"]{border-color:var(--gold-d);background:var(--gold);color:#18204a;box-shadow:0 3px 0 var(--gold-d)}
.chip.holo[aria-pressed="true"]{background:var(--holo);border-color:#b48cff;box-shadow:0 3px 0 #8a6ad6}
.chip.add{border-style:dashed;color:var(--soft)}
.newrow{display:flex;gap:8px;margin-top:10px}
.newin{flex:1;min-width:0;font-size:1.15rem;font-weight:700;padding:8px 14px;border-radius:14px;border:3px solid var(--line);background:var(--sleeve)}
.big{width:100%;margin-top:20px;border:0;border-radius:18px;padding:15px;font-family:var(--disp);font-size:1.55rem;background:var(--ok);color:#fff;box-shadow:0 5px 0 var(--ok-d)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ok-d)}
.big.alt{background:var(--night2);box-shadow:0 5px 0 var(--night)}
.big.ghost{background:transparent;color:var(--soft);box-shadow:inset 0 0 0 3px var(--line);font-size:1.2rem}
.cardsbox .meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;color:var(--soft);font-weight:700;font-size:.95rem;margin:0 2px 8px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;max-height:42vh;overflow:auto;overscroll-behavior:contain;padding:6px;border-radius:14px;background:var(--sleeve);box-shadow:inset 0 0 0 2px var(--line)}
.cpick{border:0;padding:0;background:var(--empty);border-radius:8px;aspect-ratio:63/88;overflow:hidden;position:relative}
.cpick img{width:100%;height:100%;object-fit:cover;display:block}
.cpick .noimg{position:absolute;inset:0;display:grid;place-items:center;padding:6px;color:#fff;font-size:.8rem;font-weight:700;text-align:center}
.cpick[aria-pressed="true"]{box-shadow:0 0 0 4px var(--gold),0 0 0 7px var(--night2)}
.cpick[aria-pressed="true"]::after{content:"✓";position:absolute;right:4px;top:4px;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#18204a;font-weight:800;display:grid;place-items:center}
.cpick.mine::before{content:"heb ik";position:absolute;left:4px;bottom:4px;z-index:1;background:var(--ok);color:#fff;font-size:.7rem;font-weight:800;border-radius:6px;padding:0 6px}
.cinfo{margin-top:8px;padding:8px 12px;border-radius:12px;background:var(--sleeve);font-weight:700;font-size:.95rem;color:var(--soft)}
.cinfo b{color:var(--ink)}
.loading,.cerr{padding:18px 10px;text-align:center;color:var(--soft);font-weight:700;background:var(--sleeve);border-radius:14px}
.owned{margin-top:4px;display:grid;gap:6px}
.own{display:flex;align-items:center;gap:10px;background:var(--sleeve);border-radius:12px;padding:8px 10px;box-shadow:var(--shadow)}
.own .thumb{width:40px;aspect-ratio:63/88;border-radius:4px;object-fit:cover;flex:0 0 auto;background:var(--empty)}
.own .what{font-weight:800;line-height:1.2;min-width:0}
.own .what small{display:block;color:var(--soft);font-weight:600;font-size:.82rem}
.own .n{margin-left:auto;font-family:var(--disp);font-size:1.4rem;min-width:2ch;text-align:center}
.step{border:0;width:40px;height:40px;border-radius:10px;background:var(--page);font-size:1.4rem;font-weight:800;box-shadow:inset 0 0 0 2px var(--line);flex:0 0 auto}
.cover{border:0;background:transparent;font-size:1.35rem;width:36px;height:40px;color:var(--soft);flex:0 0 auto}
.cover[aria-pressed="true"]{color:var(--gold-d)}
.field{width:100%;font-size:1.3rem;font-weight:700;padding:12px 14px;border-radius:14px;border:3px solid var(--line);background:var(--sleeve)}
.field:focus{border-color:var(--gold);outline:none}
.bk p{margin:10px 2px 0;color:var(--soft);font-weight:600}

/* ---------- ruilen ---------- */
.dup{display:flex;align-items:center;gap:12px;background:var(--sleeve);border-radius:16px;padding:10px 14px;margin-bottom:8px;box-shadow:var(--shadow);border:0;width:100%;text-align:left}
.dup .sw{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:1.5rem;background:linear-gradient(160deg,var(--t1),var(--t2));flex:0 0 auto;overflow:hidden}
.dup .sw img{width:100%;height:100%;object-fit:cover}
.dup .nm{font-family:var(--disp);font-size:1.25rem}
.dup .sub{font-size:.9rem;color:var(--soft);font-weight:600}
.dup .x{margin-left:auto;font-family:var(--disp);font-size:1.2rem;background:var(--gold);color:#18204a;border-radius:12px;padding:2px 10px;white-space:nowrap}
.duplist{display:grid;gap:0}

/* ---------- overzicht ---------- */
.stats{display:grid;gap:14px;grid-template-columns:1fr}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--sleeve);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi b{display:block;font-family:var(--disp);font-weight:400;font-size:2.2rem;line-height:1;color:var(--night2)}
:root[data-theme="dark"] .kpi b{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kpi b{color:var(--gold)}}
.kpi span{font-weight:700;color:var(--soft);font-size:.95rem}
.card{background:var(--sleeve);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow)}
.card h4{margin:0 0 4px;font-family:var(--disp);font-weight:400;font-size:1.3rem}
.card .top1{margin:0 0 10px;font-weight:700;color:var(--soft)}
.brow{display:grid;grid-template-columns:minmax(90px,150px) 1fr 3.2em;align-items:center;gap:10px;margin:6px 0}
.brow .lab{display:flex;align-items:center;gap:6px;font-weight:800;font-size:.98rem;min-width:0}
.brow .lab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .lab .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;flex:0 0 auto}
.brow .tr{height:16px;border-radius:8px;background:var(--page);overflow:hidden}
.brow .tr i{display:block;height:100%;border-radius:8px;background:var(--bc,var(--night2));transition:width .6s ease}
.brow .v{font-family:var(--disp);text-align:right}
.note{font-size:.9rem;color:var(--soft);font-weight:600;margin:8px 0 0}

/* ---------- melding + onthulling ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--toastb,96px) + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;z-index:30;pointer-events:none;
  background:var(--night);color:#fff;padding:10px 14px 10px 18px;border-radius:14px;font-weight:700;display:flex;gap:12px;align-items:center;transition:all .25s ease;width:max-content;max-width:min(92vw,520px);box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast button{border:0;background:var(--gold);color:#18204a;border-radius:10px;padding:4px 10px;font-weight:800}
.reveal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(8,11,32,.84);perspective:900px}
.reveal[hidden]{display:none}
.rays{position:absolute;width:160vmax;height:160vmax;left:50%;top:50%;margin:-80vmax 0 0 -80vmax;background:repeating-conic-gradient(rgba(255,203,61,.18) 0 8deg,transparent 8deg 20deg);animation:spin 14s linear infinite;
  -webkit-mask:radial-gradient(circle,#000 0 30%,transparent 60%);mask:radial-gradient(circle,#000 0 30%,transparent 60%)}
@keyframes spin{to{transform:rotate(360deg)}}
.rstack{position:relative;display:flex;flex-direction:column;align-items:center;gap:20px;padding:20px}
.rcard{position:relative;width:min(62vw,270px);aspect-ratio:63/88;transform-style:preserve-3d;animation:flip 1s cubic-bezier(.3,1.3,.5,1) .15s both}
@keyframes flip{0%{transform:rotateY(180deg) scale(.6)}100%{transform:rotateY(0) scale(1)}}
.rcard .face,.rcard .rback{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.rcard .rback{transform:rotateY(180deg);background:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 8px,transparent 8px 16px),radial-gradient(circle,#3a46a0 0 30%,transparent 31%),var(--empty);box-shadow:inset 0 0 0 6px rgba(255,203,61,.6)}
.rcard .face{background:var(--t1);padding:8px;box-shadow:0 0 0 4px rgba(255,255,255,.5),0 20px 60px rgba(0,0,0,.5);overflow:hidden}
.rcard .face.img{background:transparent;padding:0}
.rcard .face.img img{width:100%;height:100%;object-fit:contain;border-radius:14px;display:block}
.rcard .fi{height:100%;border-radius:10px;display:flex;flex-direction:column;background:linear-gradient(170deg,#fff,rgba(255,255,255,.75)),var(--t2);color:#18204a;overflow:hidden}
.rcard .fi .row{display:flex;justify-content:space-between;padding:8px 10px 0;font-weight:800}
.rcard .fi .art{flex:1;margin:8px 10px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:5rem;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.4),transparent 60%),linear-gradient(160deg,var(--t1),var(--t2))}
.rcard .fi .nm{font-family:var(--disp);font-size:1.7rem;padding:0 10px 10px;line-height:1}
.rcard.shine .face::after{content:"";position:absolute;inset:0;border-radius:16px;background:var(--holo);background-size:250% 250%;mix-blend-mode:soft-light;opacity:.7;animation:foil 3s linear infinite}
.rtext{text-align:center;font-family:var(--disp);font-size:2.2rem;line-height:1.05;color:var(--gold);text-shadow:0 3px 0 var(--gold-d);animation:drop .5s .6s both;max-width:90vw}
.rsub{text-align:center;color:#fff;font-weight:700;animation:drop .5s .9s both}
@keyframes drop{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- mis ik nog: voorbeeldplaatjes ---------- */
.slot.miss{background:#0d1230;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.slot.miss img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.9)}
.slot.miss .lbl{position:absolute;left:0;right:0;bottom:0;padding:18px 7px 6px;color:#fff;font-weight:800;font-size:.85rem;line-height:1.1;
  background:linear-gradient(180deg,transparent,rgba(10,14,40,.92) 55%)}
.slot.miss .lbl small{display:block;font-size:.72rem;opacity:.8}
.slot.miss .qb{position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#18204a;font-family:var(--disp);display:grid;place-items:center;box-shadow:0 2px 0 var(--gold-d)}
/* ---------- snel veel (bulk) ---------- */
.modes{display:flex;gap:6px;background:var(--sleeve);border-radius:16px;padding:5px;box-shadow:var(--shadow);margin:12px 0 4px;max-width:520px}
.modes button{flex:1;border:0;border-radius:12px;padding:8px 10px;font-weight:800;font-size:1.05rem;background:transparent;color:var(--soft)}
.modes button[aria-pressed="true"]{background:var(--night2);color:#fff}
.bres{display:flex;align-items:center;gap:12px;background:var(--sleeve);border-radius:16px;padding:8px 10px 8px 14px;box-shadow:var(--shadow)}
.bres .nm{font-family:var(--disp);font-size:1.3rem;flex:1;min-width:0}
.bres .nm small{display:block;font-family:"Baloo 2",sans-serif;font-size:.85rem;color:var(--soft);font-weight:700}
.bres .dot{width:40px;height:40px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:1.3rem;background:linear-gradient(160deg,var(--t1),var(--t2))}
.plus1{border:0;border-radius:14px;min-width:64px;height:52px;padding:0 14px;font-family:var(--disp);font-size:1.5rem;background:var(--ok);color:#fff;box-shadow:0 4px 0 var(--ok-d)}
.plus1:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ok-d)}
.selc{min-width:2.2ch;text-align:center;font-family:var(--disp);font-size:1.4rem}
.selc.zero{color:var(--line)}
.bsub{font-family:var(--disp);font-size:1.25rem;margin:22px 4px 8px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.btile{position:relative;border:0;border-radius:12px;padding:8px 8px 8px 12px;text-align:left;background:var(--sleeve);box-shadow:var(--shadow);min-height:70px;overflow:hidden;display:flex;flex-direction:column;gap:2px}
.btile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(180deg,var(--t1),var(--t2))}
.btile .no{display:block;font-size:.75rem;font-weight:800;color:var(--soft)}
.btile .nm{display:block;font-weight:800;line-height:1.1;font-size:.98rem;overflow-wrap:anywhere;hyphens:auto}
.btile.sel{min-height:104px}
.btile .hv{display:block;font-size:.72rem;font-weight:800;color:var(--ok)}
.btile.sel{background:linear-gradient(160deg,var(--t1),var(--t2));color:#fff}
.btile.sel .no,.btile.sel .hv{color:rgba(255,255,255,.85)}
.btile .bctl{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;padding-top:6px}
.btile .min{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.92);color:#18204a;font-weight:800;font-size:1.4rem;line-height:1;flex:0 0 auto}
.btile .badge{min-width:40px;height:30px;border-radius:15px;background:var(--gold);color:#18204a;font-family:var(--disp);font-size:1.15rem;display:grid;place-items:center;padding:0 8px}
.tray{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:9;width:min(96vw,640px);
  display:flex;align-items:center;gap:10px;background:var(--night);color:#fff;border-radius:18px;padding:10px 10px 10px 16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.tray[hidden]{display:none}
.tray .sum{flex:1;min-width:0;font-weight:700;line-height:1.1;white-space:nowrap}
.tray .sum small{display:block;font-size:.85rem;opacity:.8}
.tray .sum b{font-family:var(--disp);font-weight:400;font-size:1.4rem;color:var(--gold)}
.tray button{border:0;border-radius:12px;padding:10px 14px;font-weight:800}
.tray .clr{background:rgba(255,255,255,.14);color:#fff}
.tray .go{background:var(--ok);color:#fff;font-family:var(--disp);font-weight:400;font-size:1.25rem;box-shadow:0 3px 0 var(--ok-d)}
.filt{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.filt button{border:3px solid var(--line);background:var(--sleeve);border-radius:999px;padding:4px 14px;font-weight:800}
.filt button[aria-pressed="true"]{border-color:var(--gold-d);background:var(--gold);color:#18204a}
.tag.chk{background:#ff8a3d;color:#fff}
.own.auto{box-shadow:inset 0 0 0 3px #ff8a3d}
.okbtn{border:0;border-radius:10px;padding:0 10px;height:40px;background:#ff8a3d;color:#fff;font-weight:800;flex:0 0 auto}
.autonote{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:rgba(255,138,61,.15);font-weight:700;color:var(--ink)}
.burst{display:flex;flex-direction:column;align-items:center;gap:10px}
.burst b{font-family:var(--disp);font-weight:400;font-size:5rem;line-height:1;color:var(--gold);text-shadow:0 5px 0 var(--gold-d)}
/* ---------- mobiel ---------- */
@media (max-width:440px){
  .tray{padding:8px 8px 8px 12px;gap:6px;bottom:calc(80px + env(safe-area-inset-bottom,0px))}
  .tray button{padding:9px 10px}
  .tray .go{font-size:1.1rem}
  body.compact .rank, body.compact .status{display:none}
  body.compact header.top{padding:12px 14px 18px}
  body.compact .count b{font-size:2.4rem}
  body.compact .bar{margin-top:8px;height:14px}
  .bres{gap:8px;padding:8px}
  .bres .dot{display:none}
  .bres .nm{font-size:1.15rem}
  .plus1{min-width:58px;height:48px}
  .btile .nm{font-size:.88rem}
  .bgrid{grid-template-columns:repeat(3,1fr);gap:6px}
  .grid{grid-template-columns:repeat(3,1fr);gap:8px}
  .count b{font-size:3.3rem}
  .rank{margin-left:0;text-align:left;width:100%}
  .slot.has .art{font-size:1.8rem}
  .iconbtn .lbl{display:none}
  main{padding-left:10px;padding-right:10px}
  .sheet{padding:0 8px 8px}
}
/* ---------- desktop ---------- */
@media (min-width:900px){
  body{font-size:17px}
  nav.tabs{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:5px solid transparent;padding:8px 18px;justify-content:center;gap:8px}
  nav.tabs button{display:flex;align-items:center;gap:8px;font-size:1.05rem;padding:8px 18px;max-width:none;flex:0 0 auto}
  nav.tabs button svg{margin:0;width:22px;height:22px}
  nav.tabs button.plus svg{width:26px;height:26px;margin:0}
  nav.tabs button[aria-current="page"]{background:rgba(255,255,255,.12)}
  main{padding:10px 24px 60px}
  .regions{padding:16px 24px 6px;flex-wrap:wrap;overflow:visible}
  .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}
  .slot.has .art{font-size:2.8rem}
  .search{top:72px}
  .results{grid-template-columns:repeat(2,1fr)}
  .scrim{align-items:center;padding:24px}
  .panel{max-width:1020px;max-height:90vh;border-radius:24px}
  .pcols{display:grid;grid-template-columns:1.25fr 1fr;gap:24px;align-items:start}
  .cgrid{max-height:62vh;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
  .toast{bottom:28px}
  .tray{bottom:24px}
  .bgrid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .stats{grid-template-columns:1fr 1fr}
  .stats .kpis{grid-column:1/-1}
}
@media (hover:hover){.slot:hover{z-index:2}}
@media (max-width:380px){.btile .nm{font-size:.8rem}.btile{padding-left:10px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.slot{transform:none!important}}
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <form id="loginForm" autocomplete="on">
    <h1>Verzamelboek</h1>
    <p>Log in om je boek te openen.</p>
    <label for="lu">Gebruikersnaam</label>
    <input type="text" id="lu" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required>
    <label for="lp">Wachtwoord</label>
    <input type="password" id="lp" name="password" autocomplete="current-password" required>
    <label class="rem"><input type="checkbox" id="lr" checked> Onthoud mij op dit apparaat</label>
    <p class="err" id="lerr" role="alert"></p>
    <button class="big press" type="submit">Open mijn boek</button>
  </form>
</div>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <p class="title"><svg viewBox="0 0 24 24" class="ti"><path d="M12 2c1 6 4 9 10 10-6 1-9 4-10 10-1-6-4-9-10-10 6-1 9-4 10-10z"/></svg><span id="title">Verzamelboek</span></p>
      <div class="hbtns">
        <button class="iconbtn press" id="setBtn" aria-label="Instellingen"><svg viewBox="0 0 24 24" class="ti"><path fill-rule="evenodd" d="M10.3 2h3.4l.5 2.6 2 .9 2.2-1.5 2.4 2.4-1.5 2.2.9 2 2.6.5v3.4l-2.6.5-.9 2 1.5 2.2-2.4 2.4-2.2-1.5-2 .9-.5 2.6h-3.4l-.5-2.6-2-.9-2.2 1.5-2.4-2.4 1.5-2.2-.9-2L2 13.7v-3.4l2.6-.5.9-2L4 5.6 6.4 3.2l2.2 1.5 2-.9zM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"/></svg><span class="lbl">Instellingen</span></button>
        <button class="iconbtn press" id="themeBtn" aria-label="Licht of donker">◐</button>
      </div>
    </div>
    <div class="hero">
      <div class="count"><b id="cnt">0</b><span>van 1025 Pokémon</span></div>
      <div class="rank"><strong id="rankName">Beginnende verzamelaar</strong><small id="rankNext"></small></div>
    </div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="1025" id="barWrap"><i id="bar"></i></div>
    <p class="status" id="status"></p>
  </div>
</header>

<nav class="tabs" aria-label="Schermen">
  <button data-v="boek" aria-current="page"><svg viewBox="0 0 24 24" class="ti"><path d="M4 4a2 2 0 0 1 2-2h13v18H6a2 2 0 0 0-2 2zm2 15h13M8 6h8v3H8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>Boek</button>
  <button data-v="mis"><svg viewBox="0 0 24 24" class="ti"><path d="M12 2l10 10-10 10L2 12z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 9.5a2 2 0 1 1 2.8 1.8c-.6.3-.8.8-.8 1.4M12 15.5v.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Mis ik nog</button>
  <button data-v="erbij" class="plus"><svg viewBox="0 0 24 24" class="ti"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg>Erbij</button>
  <button data-v="dub"><svg viewBox="0 0 24 24" class="ti"><path d="M4 9h13l-3-3M20 15H7l3 3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Ruilen</button>
  <button data-v="stat"><svg viewBox="0 0 24 24" class="ti"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>Overzicht</button>
</nav>

<div class="wrap">
  <div class="regions" id="regions" role="group" aria-label="Kies een regio"></div>
  <main>
    <section class="view" id="v-boek"></section>
    <section class="view" id="v-erbij" hidden>
      <div class="modes" role="group" aria-label="Manier van toevoegen"><button id="mOne" aria-pressed="true">Eén kaart</button><button id="mBulk" aria-pressed="false">Snel veel</button></div>
      <div id="bulkBox" hidden></div>
      <div id="oneBox">
      <div class="search"><input id="q" type="search" placeholder="Typ een naam of nummer…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Zoek een Pokémon" enterkeyhint="search"></div>
      <div class="results" id="results"></div>
      </div>
    </section>
    <section class="view" id="v-mis" hidden></section>
    <section class="view" id="v-dub" hidden></section>
    <section class="view" id="v-stat" hidden></section>
  </main>
</div>

<div class="scrim" id="scrim" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<div class="reveal" id="reveal" hidden aria-live="polite"></div>
<div class="tray" id="tray" hidden></div>
<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="undo">Terug</button></div>

const keyOf = (s,f,cid,z,a) => [s,f,cid||"",z||"",a?"1":""].join("|");
const parseKey = k => { const [s,f,cid,z,a] = k.split("|"); return {s:s||"Gewoon", f:f||"Normaal", cid:cid||"", z:(z==="IR"||z==="SIR")?z:"", a:a==="1"}; };
const keyFromP = p => keyOf(p.s,p.f,p.cid,p.z,p.a);
function norm(o){
  const c = JSON.parse(JSON.stringify(o || {}));
  const kaarten = {};
  for(const [n,m] of Object.entries(c.kaarten || {})){
    const nn = parseInt(n,10); if(!(nn>=1 && nn<=1025) || !m || typeof m!=="object") continue;
    const mm = {};
    for(const [k,v] of Object.entries(m)){ const x = Math.floor(Number(v)); if(!(x>0) || typeof k!=="string") continue;
      const p = parseKey(k); const nk = keyFromP(p); mm[nk] = (mm[nk]||0) + x; }
    if(Object.keys(mm).length) kaarten[nn] = mm;
  }
  const img = {}; for(const [k,v] of Object.entries(c.img || {})){ if(typeof v==="string" && IMG_OK.test(v)) img[k] = v; }
  const meta = {}; for(const [k,v] of Object.entries(c.meta || {})){ if(v && typeof v==="object") meta[k] = {r:String(v.r||"").slice(0,60), set:String(v.set||"").slice(0,80), setId:String(v.setId||"").slice(0,40)}; }
  const cover = {}; for(const [k,v] of Object.entries(c.cover || {})){ if(typeof v==="string") cover[k] = v; }
  const soorten = Array.isArray(c.soorten) && c.soorten.length ? c.soorten.filter(s=>typeof s==="string" && s && !s.includes("|")).slice(0,40) : [...DEFAULT_SOORTEN];
  if(!soorten.includes("Gewoon")) soorten.unshift("Gewoon");
  return {v:3, owner: typeof c.owner==="string" ? c.owner.slice(0,24) : "", soorten, kaarten, img, meta, cover};
}

function autoCount(n){ let c = 0; for(const [k,v] of Object.entries(state.kaarten[n]||{})) if(parseKey(k).a) c += v; return c; }
function allAuto(){ let c = 0, p = 0; for(const n of Object.keys(state.kaarten)){ const a = autoCount(n); if(a){ c += a; p++; } } return {cards:c, poke:p}; }
function removeAuto(n, c){ const m = state.kaarten[n]; if(!m) return [];
  const removed = [];
  for(const k of Object.keys(m)){ if(c<=0) break; if(!parseKey(k).a) continue; const d = Math.min(c, m[k]); m[k] -= d; c -= d; removed.push([k,d]); if(!m[k]) delete m[k]; }
  if(!Object.keys(m).length) delete state.kaarten[n]; return removed; }

  const m = state.kaarten[n] || {}; const cids = [];
  for(const k of Object.keys(m)){ const p = parseKey(k); if(p.cid && state.img[p.cid]) cids.push(p); }
  if(!cids.length) return null;
  const want = state.cover[n]; return cids.find(p=>p.cid===want) || cids.find(p=>!p.a) || cids[0];
}
function specials(n){ const m = state.kaarten[n]||{}; const out = new Set(); let shine=false, z = "", chk = false;
  for(const k of Object.keys(m)){ const p = parseKey(k); if(p.a){ chk = true; continue; } if(p.s!=="Gewoon") out.add(p.s); if(p.f!=="Normaal") shine=true; if(p.z==="SIR" || (p.z==="IR" && z!=="SIR")) z = p.z; }
  return {list:[...out], shine, z, chk}; }

/* soort afleiden uit de kaartnaam */
function detectSoort(name){
  let s = "Gewoon";
  if(/^(M|Mega)\s/.test(name)) s = "Mega";
  else if(/\bVMAX\b/.test(name)) s = "VMAX";
  else if(/\bVSTAR\b/.test(name)) s = "VSTAR";
  else if(/\sV(-UNION)?$/.test(name) || /\sV\s/.test(name)) s = "V";
  else if(/[\s-]GX\b/.test(name)) s = "GX";
  else if(/[\s-]EX\b/.test(name)) s = "EX";
  else if(/\sex\b/.test(name)) s = "ex";
  return state.soorten.includes(s) ? s : (state.soorten.includes("Anders") ? "Anders" : "Gewoon");
}

const cardCache = {}, metaWait = {};
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
async function getJSON(u){ const r = await fetch(u); if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); }
async function loadCards(n){
  if(cardCache[n]) return cardCache[n];
  const en = nameOf(n);
  const [byDex, byName] = await Promise.allSettled([ getJSON(API + "/cards?dexId=eq:" + n), getJSON(API + "/cards?name=" + encodeURIComponent(en)) ]);
  if(byDex.status==="rejected" && byName.status==="rejected") throw byName.reason;
  const re = new RegExp("(^|[^A-Za-z])" + escRe(en) + "($|[^A-Za-z])", "i");
  const map = new Map();
  if(byDex.status==="fulfilled" && Array.isArray(byDex.value)) byDex.value.forEach(c => { if(c && c.id) map.set(c.id, c); });
  if(byName.status==="fulfilled" && Array.isArray(byName.value)) byName.value.forEach(c => { if(c && c.id && re.test(c.name||"")) map.set(c.id, c); });
  const list = [...map.values()].filter(c => typeof c.image==="string" && IMG_OK.test(c.image)).reverse();
  cardCache[n] = list; return list;
}

    const m = {r: String(c && c.rarity || "").slice(0,60), set: String(c && c.set && c.set.name || "").slice(0,80), setId: String(c && c.set && c.set.id || "").slice(0,40)};

async function backfillMeta(){
  const todo = new Set();
  for(const m of Object.values(state.kaarten)) for(const k of Object.keys(m)){ const p = parseKey(k); if(p.cid && !p.a && !state.meta[p.cid]) todo.add(p.cid); }
  let changed = false;
  for(const cid of todo){
    try{ const meta = await fetchMeta(cid); changed = true;
      // zeldzaamheid alsnog invullen bij kaarten waar die nog leeg was
      const z = rarityToZ(meta.r);
      if(z) for(const [n,m] of Object.entries(state.kaarten)) for(const [k,v] of Object.entries({...m})){ const p = parseKey(k); if(p.cid===cid && !p.z && !p.a){ delete m[k]; const nk = keyOf(p.s,p.f,p.cid,z); m[nk] = (m[nk]||0) + v; } }
    }catch(e){ break; }
    await new Promise(r => setTimeout(r, 150));
  }
  if(changed){ save(); renderAll(); }
}

/* oudste kaart van een Pokémon (TCGdex sorteert standaard op uitkomstdatum, oud naar nieuw) */
const oldestCache = {};
async function oldestCard(n){
  if(n in oldestCache) return oldestCache[n];
  const ok = c => c && c.id && typeof c.image==="string" && IMG_OK.test(c.image);
  let found = null;
  try{ const l = await getJSON(API + "/cards?dexId=eq:" + n); if(Array.isArray(l)) found = l.find(ok) || null; }catch(e){}
  if(!found){
    const en = nameOf(n), re = new RegExp("(^|[^A-Za-z])" + escRe(en) + "($|[^A-Za-z])", "i");
    const l = await getJSON(API + "/cards?name=" + encodeURIComponent(en)); // gooit bij netwerkfout
    if(Array.isArray(l)) found = l.find(c => ok(c) && re.test(c.name||"")) || null;
  }
  oldestCache[n] = found; return found;
}
let resolving = false;
async function resolveAuto(){
  if(resolving) return; resolving = true;
  try{
    const todo = []; for(const [n,m] of Object.entries(state.kaarten)) for(const k of Object.keys(m)){ const p = parseKey(k); if(p.a && !p.cid && !(n in oldestCache && oldestCache[n]===null)){ todo.push(+n); break; } }
    let done = 0;
    for(const n of todo){
      setStatus("Plaatjes zoeken voor snel toegevoegde kaarten: " + done + " van " + todo.length + "…");
      let c; try{ c = await oldestCard(n); }catch(e){ setStatus("Plaatjes zoeken lukt nu niet (geen internet?). Later gaat het vanzelf verder."); setTimeout(()=>{ resolving=false; resolveAuto(); }, 30000); return; }
      done++;
      const m = state.kaarten[n];
      if(c && m){ for(const [k,v] of Object.entries({...m})){ const p = parseKey(k); if(p.a && !p.cid){ delete m[k]; const nk = keyOf(p.s,p.f,c.id,p.z,true); m[nk] = (m[nk]||0) + v; } }
        state.img[c.id] = c.image; save(); }
      if(done % 8 === 0 || done===todo.length) renderAll();
      await new Promise(r => setTimeout(r, 120));
    }
    if(todo.length) setStatus("Bewaard op dit apparaat.");
  } finally { resolving = false; }
}

let preview = {}; try{ const p = JSON.parse(localStorage.getItem(LS_PREV) || "{}"); for(const [n,u] of Object.entries(p)) if(u==="" || (typeof u==="string" && IMG_OK.test(u))) preview[n] = u; }catch(e){}
let prevTimer = null; function savePreview(){ clearTimeout(prevTimer); prevTimer = setTimeout(()=>{ try{ localStorage.setItem(LS_PREV, JSON.stringify(preview)); }catch(e){} }, 800); }
async function previewCard(n){
  const ok = c => c && c.id && typeof c.image==="string" && IMG_OK.test(c.image);
  const en = nameOf(n);
  let l = []; try{ const r = await getJSON(API + "/cards?dexId=eq:" + n); if(Array.isArray(r)) l = r.filter(ok); }catch(e){}
  if(!l.length){ const re = new RegExp("(^|[^A-Za-z])" + escRe(en) + "($|[^A-Za-z])", "i"); const r = await getJSON(API + "/cards?name=" + encodeURIComponent(en)); if(Array.isArray(r)) l = r.filter(c => ok(c) && re.test(c.name||"")); }

const prevQueue = [], prevBusy = new Set(); let prevActive = 0, prevPaused = false;
function wantPreview(n){ if(n in preview || prevBusy.has(n) || prevPaused) return; prevBusy.add(n); prevQueue.push(n); pumpPreview(); }
function pumpPreview(){
  while(prevActive < 3 && prevQueue.length){
    const n = prevQueue.shift(); prevActive++;
    previewCard(n).then(u => { preview[n] = u; savePreview(); const old = document.querySelector('#v-mis .slot[data-n="'+n+'"]'); if(old && u) old.replaceWith(missSlot(n)); })
      .catch(() => { prevPaused = true; prevQueue.length = 0; setTimeout(()=>{ prevPaused = false; }, 30000); })
      .finally(() => { prevBusy.delete(n); prevActive--; pumpPreview(); });
  }
}
const prevObs = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ prevObs.unobserve(e.target); wantPreview(+e.target.dataset.n); } }), {rootMargin:"400px 0px"}) : null;
function missSlot(n){

  if(u){
    const img = el("img",{src:u + "/low.webp",alt:"",loading:"lazy",decoding:"async"});

    img.addEventListener("error", () => { delete preview[n]; b.replaceWith(slot(n)); });

}

    el("div",{class:"rsub"}, nieuw===1 ? "nieuwe Pokémon in je boek" : "nieuwe Pokémon in je boek"), el("div",{class:"rsub"},"Tik om verder te gaan")));
  document.getElementById("toast").classList.remove("show");
  pendingMsg = msg; r.hidden = false; clearTimeout(revealTimer); revealTimer = setTimeout(closeReveal, 5000);
}
document.getElementById("mOne").addEventListener("click", () => setMode(false));
document.getElementById("mBulk").addEventListener("click", () => setMode(true));

/* ---------- onthulling ---------- */
let revealTimer = null, pendingMsg = "";
function reveal(n, shine, s, bigImg, milestone){
  const r = document.getElementById("reveal"); r.innerHTML = "";
  let face;
  if(bigImg){ face = el("div",{class:"face img"}, el("img",{src:bigImg,alt:nameOf(n)})); }
  else {
    const art = el("div",{class:"art"}); art.append(icon(types(n)[0]));
    face = el("div",{class:"face"}, el("div",{class:"fi"}, el("div",{class:"row"}, el("span",{}, pad(n)), el("span",{}, s!=="Gewoon"?s:"")), art, el("div",{class:"nm"}, nameOf(n))));
  }
  const card = el("div",{class:"rcard"+(shine?" shine":"")}, el("div",{class:"rback"}), face);
  colorVars(card,n);
  const conf = el("div",{class:"confetti"});
  const cols = ["#ffcb3d","#7af0ff","#ff8fd0","#7affc1","#b48cff", TYPE[types(n)[0]]];
  const amount = milestone ? 90 : 40;
  for(let i=0;i<amount;i++){ conf.append(el("i",{style:`left:${Math.random()*100}%;background:${cols[i%cols.length]};animation-delay:${(Math.random()*0.8).toFixed(2)}s;animation-duration:${(1.8+Math.random()*1.6).toFixed(2)}s`})); }
  const head = milestone ? (milestone===1025 ? "Alle 1025 gevangen!" : milestone + " Pokémon gevangen!") : nameOf(n) + " gevangen!";
  r.append(el("div",{class:"rays"}), conf, el("div",{class:"rstack"}, el("div",{class:"rtext"}, head), card, el("div",{class:"rsub"}, milestone ? nameOf(n) + " was nummer " + milestone + ". Tik om verder te gaan" : "Tik om verder te gaan")));
  document.getElementById("toast").classList.remove("show");
  r.hidden = false; clearTimeout(revealTimer); revealTimer = setTimeout(closeReveal, milestone ? 6000 : 4500);
}
function closeReveal(){ const r = document.getElementById("reveal"); if(r.hidden) return; r.hidden = true; r.innerHTML = ""; clearTimeout(revealTimer);
  if(pendingMsg){ toast(pendingMsg); pendingMsg = ""; }
  if(view==="erbij" && !bulkMode) document.getElementById("q").focus(); }
document.getElementById("reveal").addEventListener("click", closeReveal);

/* ---------- 3D-kantelen op desktop ---------- */
if(matchMedia("(hover:hover) and (pointer:fine)").matches && !matchMedia("(prefers-reduced-motion:reduce)").matches){
  document.addEventListener("pointermove", e => {
    const s = e.target.closest && e.target.closest(".slot.has,.slot.photo"); 
    document.querySelectorAll(".slot.tilt").forEach(x => { if(x!==s){ x.classList.remove("tilt"); x.style.removeProperty("--rx"); x.style.removeProperty("--ry"); } });
    if(!s) return; const r = s.getBoundingClientRect();
    const x = (e.clientX - r.left)/r.width - .5, y = (e.clientY - r.top)/r.height - .5;
    s.classList.add("tilt"); s.style.setProperty("--ry", (x*16).toFixed(1)+"deg"); s.style.setProperty("--rx", (-y*16).toFixed(1)+"deg");
  });
}

/* ---------- navigatie ---------- */
function show(v){
  view = v; document.body.classList.toggle("compact", v==="erbij");
  document.querySelectorAll("nav.tabs button").forEach(b => { if(b.dataset.v===v) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  ["boek","erbij","mis","dub","stat"].forEach(x => document.getElementById("v-"+x).hidden = x!==v);
  document.getElementById("regions").style.display = (v==="erbij" && !bulkMode) ? "none" : "";
  renderView(); window.scrollTo(0,0); renderTray();
  if(v==="erbij" && !bulkMode) setTimeout(()=>document.getElementById("q").focus(), 50);
}
function renderView(){ if(view==="boek") renderBoek(false); else if(view==="mis") renderBoek(true); else if(view==="dub") renderDub(); else if(view==="stat") renderStat(); else if(bulkMode) renderBulk(); else renderResults(); }
function renderAll(){ renderHead(); renderView(); }
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => show(b.dataset.v)));
document.getElementById("q").addEventListener("input", renderResults);
document.getElementById("q").addEventListener("keydown", e => { if(e.key==="Enter"){ const f = document.querySelector("#results .res"); if(f) f.click(); } });
document.getElementById("scrim").addEventListener("click", e => { if(e.target.id==="scrim" && panelMode!=="owner") closePanel(); });
document.addEventListener("keydown", e => {
  if(e.key==="Escape"){ if(!document.getElementById("reveal").hidden) closeReveal(); else if(!document.getElementById("scrim").hidden && panelMode!=="owner") closePanel(); }
  if(e.key==="/" && document.activeElement.tagName!=="INPUT" && document.getElementById("gate").hidden){ e.preventDefault(); show("erbij"); }
});
document.getElementById("setBtn").addEventListener("click", openSettings);

/* thema */
try{ const t = localStorage.getItem("tvb-theme"); if(t) document.documentElement.dataset.theme = t; }catch(e){}
document.getElementById("themeBtn").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const t = dark ? "light" : "dark"; document.documentElement.dataset.theme = t; try{ localStorage.setItem("tvb-theme", t); }catch(e){}
});

let started = false;
function start(){
  if(started) return; started = true;
  loadLocal(); setStatus("Bewaard op dit apparaat."); renderAll();
  if(!state.owner) openOwner();
  setTimeout(() => { resolveAuto().then(backfillMeta); }, 800);
}
if(authed()) start(); else showGate();
</script>
</body>
