<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tijmens verzamelboek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{
  --page:#e4efff; --sleeve:#ffffff; --ink:#18204a; --soft:#56608c; --line:#bccbe8;
  --night:#161c4a; --night2:#25307a; --gold:#ffcb3d; --gold-d:#d99a0b; --ok:#2fae6a;
  --empty:#2a3478; --shadow:0 3px 0 rgba(22,28,74,.22);
  --holo:linear-gradient(115deg,#7af0ff,#b48cff 30%,#ff8fd0 50%,#ffe47a 70%,#7affc1);
  --disp:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--page:#0f1433;--sleeve:#1d2556;--ink:#eef2ff;--soft:#a9b2d9;--line:#344080;--empty:#232c66;--shadow:0 3px 0 rgba(0,0,0,.45);color-scheme:dark}
}
:root[data-theme="dark"]{--page:#0f1433;--sleeve:#1d2556;--ink:#eef2ff;--soft:#a9b2d9;--line:#344080;--empty:#232c66;--shadow:0 3px 0 rgba(0,0,0,.45);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--page);color:var(--ink);
  font-family:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:18px;line-height:1.35;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
svg.ti{width:1em;height:1em;fill:currentColor;flex:0 0 auto}

/* ---- kop: nachtelijke avonturenlucht ---- */
header.top{position:relative;color:#fff;padding:18px 18px 26px;overflow:hidden;
  background:radial-gradient(circle at 15% 20%,rgba(255,255,255,.9) 0 1px,transparent 1.5px) 0 0/90px 70px,
             radial-gradient(circle at 60% 70%,rgba(255,255,255,.6) 0 1px,transparent 1.5px) 0 0/130px 90px,
             linear-gradient(180deg,var(--night) 0%,var(--night2) 100%)}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--holo);background-size:200% 100%;animation:foil 6s linear infinite}
.top-row,.count,.bar,.status{max-width:1100px;margin-left:auto;margin-right:auto;position:relative}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.title{margin:0;font-family:var(--disp);font-size:1.35rem;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.title svg{color:var(--gold);width:1.2em;height:1.2em}
.count{margin-top:8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.count b{font-family:var(--disp);font-weight:400;font-size:4rem;line-height:.95;color:var(--gold);
  text-shadow:0 4px 0 var(--gold-d),0 6px 14px rgba(0,0,0,.35)}
.count span{font-size:1.3rem;font-weight:700}
.count small{font-size:1rem;opacity:.8;margin-left:auto;font-weight:600}
.bar{margin-top:14px;height:22px;border-radius:11px;background:rgba(0,0,0,.3);box-shadow:inset 0 2px 0 rgba(0,0,0,.3);overflow:hidden;
  background-image:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),rgba(255,255,255,.12) calc(10% - 2px) 10%)}
.bar i{display:block;height:100%;width:0;border-radius:11px;transition:width .8s cubic-bezier(.2,1.4,.4,1);
  background:linear-gradient(180deg,#ffe58a,var(--gold) 50%,var(--gold-d));box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.status{margin-top:8px;font-size:.85rem;opacity:.7}
.iconbtn{background:rgba(255,255,255,.14);border:0;border-radius:12px;padding:6px 12px;color:inherit;font-weight:700}

/* ---- regio-medailles ---- */
.regions{display:flex;gap:8px;overflow-x:auto;padding:14px 18px 6px;max-width:1100px;margin:0 auto;scrollbar-width:none}
.regions::-webkit-scrollbar{display:none}
.reg{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:3px solid var(--line);background:var(--sleeve);border-radius:16px;padding:6px 12px 6px 8px;text-align:left}
.reg[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,203,61,.3)}
.medal{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-size:.8rem;color:#fff;
  background:conic-gradient(var(--mc) calc(var(--p)*1%),var(--line) 0);position:relative}
.medal::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--mi)}
.medal span{position:relative}
.reg strong{display:block;font-family:var(--disp);font-weight:400;font-size:1.05rem;line-height:1.1}
.reg em{font-style:normal;font-size:.85rem;color:var(--soft);font-weight:600}

main{max-width:1100px;margin:0 auto;padding:6px 14px 120px}
.view[hidden]{display:none}
h2{font-family:var(--disp);font-weight:400;font-size:1.7rem;margin:18px 4px 6px}
.hint{color:var(--soft);margin:0 4px 14px;font-size:1rem}

/* ---- verzamelmap ---- */
.sheet{background:linear-gradient(180deg,var(--night2),var(--night));border-radius:20px;padding:12px;margin-bottom:18px;box-shadow:var(--shadow)}
.sheet h3{color:#fff;margin:2px 6px 12px;font-family:var(--disp);font-weight:400;font-size:1.35rem;display:flex;justify-content:space-between;align-items:baseline}
.sheet h3 span{font-family:"Baloo 2",sans-serif;font-weight:700;font-size:1rem;color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:9px}
.slot{position:relative;aspect-ratio:63/88;border-radius:11px;border:0;padding:0;text-align:left;overflow:hidden;content-visibility:auto;contain-intrinsic-size:108px 150px}
/* kaartrug = nog niet */
.slot.back{background:
   repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 6px,transparent 6px 12px),
   radial-gradient(circle at 50% 46%,#3a46a0 0 28%,transparent 29%),
   var(--empty);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.12);color:rgba(255,255,255,.55);display:flex;flex-direction:column;justify-content:space-between;padding:7px}
.slot.back .q{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) rotate(45deg);width:38%;aspect-ratio:1;border-radius:8px;
  background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 2px rgba(255,203,61,.45);display:grid;place-items:center}
.slot.back .q b{transform:rotate(-45deg);font-family:var(--disp);font-weight:400;font-size:1.6rem;color:var(--gold);opacity:.75}
.slot.back .no{font-weight:700;font-size:.8rem;position:relative}
.slot.back .nm{font-weight:700;font-size:.85rem;line-height:1.1;position:relative;word-break:break-word}
/* echte kaart = wel */
.slot.has{background:var(--t1);padding:5px;box-shadow:0 3px 0 rgba(0,0,0,.35);color:#18204a}
.slot.has .inner{position:absolute;inset:5px;border-radius:7px;overflow:hidden;display:flex;flex-direction:column;
  background:linear-gradient(170deg,rgba(255,255,255,.92),rgba(255,255,255,.72)),var(--t2)}
.slot.has .row{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 0;font-weight:800;font-size:.78rem}
.slot.has .row .ics{display:flex;gap:2px}
.slot.has .row .ics span{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px}
.slot.has .art{flex:1;margin:4px 6px;border-radius:5px;display:grid;place-items:center;color:rgba(255,255,255,.95);font-size:2.4rem;
  background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.35),transparent 60%),linear-gradient(160deg,var(--t1),var(--t2));box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.slot.has .nm{font-family:var(--disp);font-weight:400;font-size:.98rem;line-height:1.05;padding:0 6px 3px;word-break:break-word}
.slot.has .tags{position:absolute;left:10px;right:10px;top:30px;display:flex;flex-wrap:wrap;gap:3px}
.tag{font-size:.7rem;font-weight:800;padding:0 6px;border-radius:6px;background:#18204a;color:#fff;line-height:1.55;box-shadow:0 1px 0 rgba(0,0,0,.3)}
.tag.cnt{position:absolute;right:0;top:0;background:var(--gold);color:#18204a}
.slot.has.shine::after{content:"";position:absolute;inset:0;background:var(--holo);background-size:250% 250%;mix-blend-mode:soft-light;opacity:.55;animation:foil 4s linear infinite;pointer-events:none}
@keyframes foil{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.slot.pop{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.12) rotate(-2deg)}100%{transform:scale(1)}}

/* ---- zoeken ---- */
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--page);padding:12px 0}
.search input{width:100%;font-size:1.5rem;font-weight:700;padding:14px 18px;border-radius:18px;border:4px solid var(--night2);background:var(--sleeve);box-shadow:var(--shadow)}
.search input:focus{border-color:var(--gold);outline:none}
.results{display:grid;gap:8px}
.res{display:flex;align-items:center;gap:12px;border:0;border-radius:16px;padding:10px 14px;background:var(--sleeve);box-shadow:var(--shadow);text-align:left;font-family:var(--disp);font-size:1.35rem}
.res .dot{width:40px;height:40px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:1.4rem;background:linear-gradient(160deg,var(--t1),var(--t2))}
.res small{font-family:"Baloo 2",sans-serif;font-size:.9rem;color:var(--soft);font-weight:700;margin-left:auto;text-align:right}
.res .own{font-size:.8rem;background:var(--ok);color:#fff;border-radius:8px;padding:0 8px;font-family:"Baloo 2",sans-serif;font-weight:800}
.empty{padding:28px 10px;text-align:center;color:var(--soft);font-weight:600}

/* ---- paneel ---- */
.scrim{position:fixed;inset:0;background:rgba(8,11,32,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.panel{background:var(--page);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:0 18px calc(22px + env(safe-area-inset-bottom,0px))}
.phead{display:flex;align-items:center;gap:12px;margin:0 -18px 6px;padding:16px 18px;color:#fff;background:linear-gradient(160deg,var(--t1),var(--t2));border-radius:24px 24px 0 0}
.phead .badge{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:2rem}
.phead h3{margin:0;font-family:var(--disp);font-weight:400;font-size:1.9rem;line-height:1.05;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.phead p{margin:0;font-size:.95rem;font-weight:700;opacity:.9}
.close{margin-left:auto;border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:12px;width:44px;height:44px;font-size:1.4rem;font-weight:800}
.label{font-family:var(--disp);font-size:1.15rem;margin:16px 2px 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:3px solid var(--line);background:var(--sleeve);border-radius:14px;padding:8px 16px;font-weight:800;font-size:1.15rem;min-width:64px}
.chip[aria-pressed="true"]{border-color:var(--gold-d);background:var(--gold);color:#18204a;box-shadow:0 3px 0 var(--gold-d)}
.chip.holo[aria-pressed="true"]{background:var(--holo);border-color:#b48cff;box-shadow:0 3px 0 #8a6ad6}
.chip.add{border-style:dashed;color:var(--soft)}
.newrow{display:flex;gap:8px;margin-top:10px}
.newin{flex:1;min-width:0;font-size:1.15rem;font-weight:700;padding:8px 14px;border-radius:14px;border:3px solid var(--line);background:var(--sleeve)}
.big{width:100%;margin-top:20px;border:0;border-radius:18px;padding:16px;font-family:var(--disp);font-size:1.6rem;background:var(--ok);color:#fff;box-shadow:0 5px 0 #1d7a48;letter-spacing:.01em}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #1d7a48}
.owned{margin-top:18px;display:grid;gap:6px}
.own{display:flex;align-items:center;gap:10px;background:var(--sleeve);border-radius:12px;padding:8px 10px;box-shadow:var(--shadow)}
.own .what{font-weight:800}
.own .n{margin-left:auto;font-family:var(--disp);font-size:1.4rem;min-width:2ch;text-align:center}
.step{border:0;width:40px;height:40px;border-radius:10px;background:var(--page);font-size:1.4rem;font-weight:800;box-shadow:inset 0 0 0 2px var(--line)}

/* ---- dubbelen ---- */
.dup{display:flex;align-items:center;gap:12px;background:var(--sleeve);border-radius:16px;padding:10px 14px;margin-bottom:8px;box-shadow:var(--shadow);border:0;width:100%;text-align:left}
.dup .sw{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:1.5rem;background:linear-gradient(160deg,var(--t1),var(--t2));flex:0 0 auto}
.dup .nm{font-family:var(--disp);font-size:1.25rem}
.dup .sub{font-size:.9rem;color:var(--soft);font-weight:600}
.dup .x{margin-left:auto;font-family:var(--disp);font-size:1.3rem;background:var(--gold);color:#18204a;border-radius:12px;padding:2px 10px}

/* ---- navigatie ---- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--night);border-top:5px solid transparent;border-image:var(--holo) 1;
  padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:6px}
nav.tabs button{flex:1;max-width:200px;border:0;background:transparent;color:#fff;opacity:.65;border-radius:14px;padding:6px 4px;font-weight:700;font-size:.95rem;line-height:1.1}
nav.tabs button[aria-current="page"]{opacity:1;color:var(--gold)}
nav.tabs button svg{display:block;margin:0 auto 2px;width:26px;height:26px}
nav.tabs button.plus svg{background:var(--gold);color:var(--night);border-radius:50%;padding:3px;width:30px;height:30px;margin-top:-2px}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;z-index:30;pointer-events:none;
  background:var(--night);color:#fff;padding:10px 14px 10px 18px;border-radius:14px;font-weight:700;display:flex;gap:12px;align-items:center;transition:all .25s ease;width:max-content;max-width:min(92vw,520px);box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast button{border:0;background:var(--gold);color:#18204a;border-radius:10px;padding:4px 10px;font-weight:800}

/* ---- onthulling: nieuwe Pokémon ---- */
.reveal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(8,11,32,.82);perspective:900px}
.reveal[hidden]{display:none}
.rays{position:absolute;width:160vmax;height:160vmax;left:50%;top:50%;margin:-80vmax 0 0 -80vmax;
  background:repeating-conic-gradient(rgba(255,203,61,.18) 0 8deg,transparent 8deg 20deg);animation:spin 14s linear infinite;
  -webkit-mask:radial-gradient(circle,#000 0 30%,transparent 60%);mask:radial-gradient(circle,#000 0 30%,transparent 60%)}
@keyframes spin{to{transform:rotate(360deg)}}
.rcard{position:relative;width:min(62vw,250px);aspect-ratio:63/88;transform-style:preserve-3d;animation:flip 1s cubic-bezier(.3,1.3,.5,1) .15s both}
@keyframes flip{0%{transform:rotateY(180deg) scale(.6)}100%{transform:rotateY(0) scale(1)}}
.rcard .face,.rcard .rback{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.rcard .rback{transform:rotateY(180deg);background:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 8px,transparent 8px 16px),radial-gradient(circle,#3a46a0 0 30%,transparent 31%),var(--empty);box-shadow:inset 0 0 0 6px rgba(255,203,61,.6)}
.rcard .face{background:var(--t1);padding:8px;box-shadow:0 0 0 4px rgba(255,255,255,.5),0 20px 60px rgba(0,0,0,.5)}
.rcard .fi{height:100%;border-radius:10px;display:flex;flex-direction:column;background:linear-gradient(170deg,#fff,rgba(255,255,255,.75)),var(--t2);color:#18204a;overflow:hidden}
.rcard .fi .row{display:flex;justify-content:space-between;padding:8px 10px 0;font-weight:800}
.rcard .fi .art{flex:1;margin:8px 10px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:5rem;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.4),transparent 60%),linear-gradient(160deg,var(--t1),var(--t2))}
.rcard .fi .nm{font-family:var(--disp);font-size:1.7rem;padding:0 10px 10px;line-height:1}
.rcard.shine .face::after{content:"";position:absolute;inset:0;border-radius:16px;background:var(--holo);background-size:250% 250%;mix-blend-mode:overlay;opacity:.8;animation:foil 3s linear infinite}
.rstack{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;padding:20px}
.rtext{text-align:center;font-family:var(--disp);font-size:2.2rem;color:var(--gold);text-shadow:0 3px 0 var(--gold-d);animation:drop .5s .6s both}
.rsub{text-align:center;color:#fff;font-weight:700;animation:drop .5s .9s both}
@keyframes drop{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

@media (max-width:420px){.grid{grid-template-columns:repeat(3,1fr)}.count b{font-size:3.2rem}.slot.has .art{font-size:1.8rem}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---- echte kaarten (TCGdex) ---- */
.slot.photo{background:#0d1230;padding:0;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.slot.photo img{width:100%;height:100%;object-fit:cover;display:block;border-radius:11px}
.slot.photo .tags{position:absolute;left:6px;top:6px;display:flex;flex-wrap:wrap;gap:3px}
.slot.photo.shine::after{content:"";position:absolute;inset:0;border-radius:11px;background:var(--holo);background-size:250% 250%;mix-blend-mode:soft-light;opacity:.55;animation:foil 4s linear infinite;pointer-events:none}
.cardsbox{margin-top:6px}
.cardsbox .meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;color:var(--soft);font-weight:700;font-size:.95rem;margin:0 2px 8px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;max-height:46vh;overflow:auto;padding:4px;border-radius:14px;background:var(--sleeve);box-shadow:inset 0 0 0 2px var(--line)}
.cpick{border:0;padding:0;background:var(--empty);border-radius:8px;aspect-ratio:63/88;overflow:hidden;position:relative;outline:0}
.cpick img{width:100%;height:100%;object-fit:cover;display:block}
.cpick .noimg{position:absolute;inset:0;display:grid;place-items:center;padding:6px;color:#fff;font-size:.8rem;font-weight:700;text-align:center}
.cpick[aria-pressed="true"]{box-shadow:0 0 0 4px var(--gold),0 0 0 7px var(--night2)}
.cpick[aria-pressed="true"]::after{content:"✓";position:absolute;right:4px;top:4px;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#18204a;font-weight:800;display:grid;place-items:center}
.loading,.cerr{padding:18px 10px;text-align:center;color:var(--soft);font-weight:700;background:var(--sleeve);border-radius:14px}
.own .thumb{width:38px;aspect-ratio:63/88;border-radius:4px;object-fit:cover;flex:0 0 auto;background:var(--empty)}
.rcard .face.img{background:transparent;padding:0;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.rcard .face.img img{width:100%;height:100%;object-fit:contain;border-radius:14px;display:block}
.bk p{margin:8px 2px 0;color:var(--soft);font-weight:600}
.bk .big.alt{background:var(--night2);box-shadow:0 5px 0 var(--night)}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <p class="title"><svg viewBox="0 0 24 24" class="ti"><path d="M12 2c1 6 4 9 10 10-6 1-9 4-10 10-1-6-4-9-10-10 6-1 9-4 10-10z"/></svg>Tijmens verzamelboek</p>
    <span style="display:flex;gap:8px"><button class="iconbtn" id="backupBtn">Back-up</button><button class="iconbtn" id="themeBtn" aria-label="Licht of donker">◐</button></span>
  </div>
  <div class="count"><b id="cnt">0</b><span>van 1025 Pokémon</span><small id="cards">0 kaarten</small></div>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="1025" id="barWrap"><i id="bar"></i></div>
  <p class="status" id="status"></p>
</header>

<div class="regions" id="regions" role="group" aria-label="Kies een regio"></div>

<main>
  <section class="view" id="v-boek"></section>

  <section class="view" id="v-erbij" hidden>

const DEFAULT_SOORTEN = ["Gewoon","ex","EX","GX","V","VMAX","VSTAR","Mega","Anders"];
const AFWERKING = ["Normaal","Holo","Reverse holo"];
const LS_KEY = "tijmen-verzamelboek-v1";

const API = "https://api.tcgdex.net/v2/en";
const IMG_OK = /^https:\/\/assets\.tcgdex\.net\/[A-Za-z0-9._\/-]+$/;

// kaarten: { "25": { "ex|Holo|sv03.5-025": 1, "Gewoon|Normaal": 2 } }   img: { "sv03.5-025": "https://assets.tcgdex.net/..." }
let state = {v:2, soorten:[...DEFAULT_SOORTEN], kaarten:{}, img:{}};

/* ---------- opslag (op dit apparaat) ---------- */
function norm(o){
  const c = JSON.parse(JSON.stringify(o || {}));
  const kaarten = {};
  for(const [n,m] of Object.entries(c.kaarten || {})){
    const nn = parseInt(n,10); if(!(nn>=1 && nn<=1025) || !m || typeof m!=="object") continue;
    const mm = {}; for(const [k,v] of Object.entries(m)){ const x = Math.floor(Number(v)); if(x>0 && typeof k==="string" && k.split("|").length>=2) mm[k] = x; }
    if(Object.keys(mm).length) kaarten[nn] = mm;
  }
  const img = {}; for(const [k,v] of Object.entries(c.img || {})){ if(typeof v==="string" && IMG_OK.test(v)) img[k] = v; }
  const soorten = Array.isArray(c.soorten) && c.soorten.length ? c.soorten.filter(s=>typeof s==="string" && s && !s.includes("|")).slice(0,40) : [...DEFAULT_SOORTEN];
  if(!soorten.includes("Gewoon")) soorten.unshift("Gewoon");
  return {v:2, soorten, kaarten, img};
}
function loadLocal(){ try{ const s = localStorage.getItem(LS_KEY); if(s) state = norm(JSON.parse(s)); }catch(e){} }
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); setStatus("Bewaard op dit apparaat."); }catch(e){ setStatus("Opslaan lukt niet op dit apparaat. Maak een back-up."); } }
function setStatus(t){ document.getElementById("status").textContent = t; }

/* ---------- helpers ---------- */
const el = (t, a={}, ...k) => { const e = document.createElement(t); for(const [x,y] of Object.entries(a)){ if(y==null) continue; if(x==="style") e.style.cssText=y; else if(x.startsWith("on")) e.addEventListener(x.slice(2), y); else e.setAttribute(x,y);} for(const c of k){ if(c==null) continue; e.append(c.nodeType?c:document.createTextNode(c)); } return e; };
const pad = n => "#" + String(n).padStart(3,"0");
const nameOf = n => DEX[n-1][0];
const types = n => DEX[n-1][4];
const total = n => { const m = state.kaarten[n]; if(!m) return 0; let s=0; for(const v of Object.values(m)) s+=v; return s; };
const has = n => total(n) > 0;
const fold = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
const SEARCH = DEX.map((d,i) => ({n:i+1, keys:[d[0],d[1]||"",d[2]||""].filter(Boolean).map(fold)}));
const parseKey = k => { const [s,f,cid] = k.split("|"); return {s, f, cid: cid || ""}; };
const imgSmall = cid => state.img[cid] ? state.img[cid] + "/low.webp" : "";
function colorVars(e, n){ const t = types(n); e.style.setProperty("--t1", TYPE[t[0]]||"#888"); e.style.setProperty("--t2", t[1] ? TYPE[t[1]] : shade(TYPE[t[0]]||"#888")); }
function shade(h){ const n = parseInt(h.slice(1),16); const f = c => Math.max(0,Math.round(c*0.68)); return "#" + [n>>16,(n>>8)&255,n&255].map(c=>f(c).toString(16).padStart(2,"0")).join(""); }
function specials(n){ const m = state.kaarten[n]||{}; const out = new Set(); let shine=false, photo="", photoShine=false;
  for(const [k,v] of Object.entries(m)){ if(!v) continue; const p = parseKey(k); if(p.s!=="Gewoon") out.add(p.s); if(p.f!=="Normaal") shine=true;
    if(!photo && p.cid && state.img[p.cid]){ photo = p.cid; photoShine = p.f!=="Normaal"; } }
  return {list:[...out], shine, photo, photoShine}; }
function inRegion(n){ return region===0 || DEX[n-1][3]===region; }
function describe(p){ return p.s + (p.f!=="Normaal" ? " · " + p.f : ""); }

/* soort afleiden uit de kaartnaam (TCGdex) */
function detectSoort(name){
  let s = "Gewoon";
  if(/^(M|Mega)\s/.test(name)) s = "Mega";
  else if(/\bVMAX\b/.test(name)) s = "VMAX";
  else if(/\bVSTAR\b/.test(name)) s = "VSTAR";
  else if(/\sV(-UNION)?$/.test(name) || /\sV\s/.test(name)) s = "V";
  else if(/[\s-]GX\b/.test(name)) s = "GX";
  else if(/[\s-]EX\b/.test(name)) s = "EX";
  else if(/\sex\b/.test(name)) s = "ex";
  return state.soorten.includes(s) ? s : (state.soorten.includes("Anders") ? "Anders" : "Gewoon");
}

/* ---------- TCGdex ---------- */
const cardCache = {};
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
async function getJSON(u){ const r = await fetch(u); if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); }
async function loadCards(n){
  if(cardCache[n]) return cardCache[n];
  const en = nameOf(n);
  const [byDex, byName] = await Promise.allSettled([
    getJSON(API + "/cards?dexId=eq:" + n),
    getJSON(API + "/cards?name=" + encodeURIComponent(en))
  ]);
  if(byDex.status==="rejected" && byName.status==="rejected") throw byName.reason;
  const re = new RegExp("(^|[^A-Za-z])" + escRe(en) + "($|[^A-Za-z])", "i");
  const map = new Map();
  if(byDex.status==="fulfilled" && Array.isArray(byDex.value)) byDex.value.forEach(c => { if(c && c.id) map.set(c.id, c); });
  if(byName.status==="fulfilled" && Array.isArray(byName.value)) byName.value.forEach(c => { if(c && c.id && re.test(c.name||"")) map.set(c.id, c); });
  const list = [...map.values()].filter(c => typeof c.image==="string" && IMG_OK.test(c.image)).reverse(); // nieuwste eerst
  cardCache[n] = list; return list;
}

/* ---------- kop + regio's ---------- */
function renderHead(){
  let c=0, cards=0; for(let n=1;n<=1025;n++){ const t=total(n); if(t>0){c++; cards+=t;} }
  document.getElementById("cnt").textContent = c;
  document.getElementById("cards").textContent = cards === 1 ? "1 kaart" : cards + " kaarten";
  document.getElementById("bar").style.width = (c/1025*100).toFixed(2) + "%";
  document.getElementById("barWrap").setAttribute("aria-valuenow", c);
  const wrap = document.getElementById("regions"); wrap.innerHTML = "";
  const mk = (idx, label, got, all) => { const pct = all ? got/all*100 : 0;
    const tier = pct>=100 ? ["#ffcb3d","#d99a0b"] : pct>=50 ? ["#c9d2e6","#8a95b3"] : pct>=20 ? ["#e09a5c","#a8622a"] : ["#6c78b8","#3a4690"];
    const m = el("span",{class:"medal",style:"--p:"+pct.toFixed(1)+";--mc:"+tier[0]+";--mi:"+tier[1]}, el("span",{}, pct>=100 ? "★" : Math.floor(pct)+"%"));
    return el("button",{class:"reg","aria-pressed":String(region===idx),onclick:()=>{region=idx; renderAll();}}, m,
      el("span",{}, el("strong",{},label), el("em",{}, got + " / " + all))); };
  wrap.append(mk(0,"Alles",c,1025));
  REGIONS.forEach((r,i) => { let a=0,g=0; DEX.forEach((d,j)=>{ if(d[3]===i+1){a++; if(has(j+1)) g++;} }); wrap.append(mk(i+1,r,g,a)); });
}

  if(!has(n)){
    return el("button",{class:"slot back","data-n":n,"aria-label":nameOf(n)+", nog niet",onclick:()=>openPanel(n)},
      el("span",{class:"q"}, el("b",{},"?")), el("span",{class:"no"}, pad(n)), el("span",{class:"nm"}, nameOf(n)));
  }
  const sp = specials(n), tags = el("span",{class:"tags"});
  sp.list.slice(0,3).forEach(s => tags.append(el("span",{class:"tag"}, s)));
  if(sp.list.length>3) tags.append(el("span",{class:"tag"}, "+" + (sp.list.length-3)));
  const cnt = total(n)>1 ? el("span",{class:"tag cnt",style:"position:absolute;right:6px;bottom:6px;top:auto"}, "×" + total(n)) : null;
  if(sp.photo){
    const img = el("img",{src:imgSmall(sp.photo),alt:"",loading:"lazy",decoding:"async"});
    img.addEventListener("error", () => { img.remove(); });
    const b = el("button",{class:"slot photo"+(sp.photoShine?" shine":""),"data-n":n,"aria-label":nameOf(n)+", "+total(n)+" kaarten",onclick:()=>openPanel(n)}, img, tags, cnt);
    colorVars(b,n); return b;
  }
  const t = types(n);
  const ics = el("span",{class:"ics"}); t.forEach(x => { const c = el("span",{style:"background:"+TYPE[x]}); c.append(icon(x)); ics.append(c); });
  const art = el("span",{class:"art"}); art.append(icon(t[0]));
  const b = el("button",{class:"slot has"+(sp.shine?" shine":""),"data-n":n,"aria-label":nameOf(n)+", "+total(n)+" kaarten",onclick:()=>openPanel(n)},
    el("span",{class:"inner"}, el("span",{class:"row"}, pad(n), ics), art, el("span",{class:"nm"}, nameOf(n))), tags, cnt);

}
function renderBoek(onlyMissing){
  const root = document.getElementById(onlyMissing ? "v-mis" : "v-boek"); root.innerHTML = "";
  if(onlyMissing){
    root.append(el("h2",{},"Deze moet je nog vangen"));
    root.append(el("p",{class:"hint"}, region ? "Kies hierboven een andere regio om verder te kijken." : "Tip: kies hierboven een regio, dan is de lijst korter."));
  }
  let any = false;
  REGIONS.forEach((r,i) => {
    const g = i+1; if(region && region!==g) return;
    const nums = []; DEX.forEach((d,j)=>{ if(d[3]===g && (!onlyMissing || !has(j+1))) nums.push(j+1); });
    if(!nums.length) return; any = true;
    const all = DEX.filter(d=>d[3]===g).length, got = DEX.filter((d,j)=>d[3]===g && has(j+1)).length;
    const grid = el("div",{class:"grid"}); nums.forEach(n => grid.append(slot(n)));
    root.append(el("div",{class:"sheet"}, el("h3",{}, r, el("span",{}, onlyMissing ? "nog " + (all-got) + " te vangen" : got + " / " + all)), grid));
  });
  if(!any) root.append(el("p",{class:"empty"}, onlyMissing ? "Allemaal gevangen in deze regio! ★" : "Nog niks in deze regio."));
}

/* ---------- ruilen ---------- */
function renderDub(){
  const root = document.getElementById("v-dub"); root.innerHTML = "";
  root.append(el("h2",{},"Ruilen"), el("p",{class:"hint"},"Hier heb je er meer dan één van. Eén houd je, de rest kun je ruilen."));
  const list = []; for(let n=1;n<=1025;n++){ if(inRegion(n) && total(n)>1) list.push(n); }
  if(!list.length){ root.append(el("p",{class:"empty"},"Nog geen dubbele kaarten.")); return; }
  list.forEach(n => {
    const parts = Object.entries(state.kaarten[n]).map(([k,v]) => v + "× " + describe(parseKey(k)).replace(" · "," "));
    const sw = el("span",{class:"sw"}); sw.append(icon(types(n)[0]));
    const b = el("button",{class:"dup",onclick:()=>openPanel(n)}, sw,
      el("span",{}, el("span",{class:"nm"}, nameOf(n)), el("br"), el("span",{class:"sub"}, parts.join(", "))),
      el("span",{class:"x"}, (total(n)-1) + " ruilen"));
    colorVars(b,n); root.append(b);
  });
}

/* ---------- zoeken ---------- */
function renderResults(){
  const q = fold(document.getElementById("q").value || ""); const root = document.getElementById("results"); root.innerHTML = "";
  if(!q){ root.append(el("p",{class:"empty"},"Typ de naam van de Pokémon op je kaart. Duitse en Franse namen werken ook.")); return; }
  const num = /^\d+$/.test(q) ? parseInt(q,10) : 0;
  const hits = [];
  SEARCH.forEach(s => { let score = 0;
    if(num && s.n===num) score = 3;
    for(const k of s.keys){ if(k.startsWith(q)) score = Math.max(score,2); else if(q.length>2 && k.includes(q)) score = Math.max(score,1); }
    if(score) hits.push([score,s.n]); });
  hits.sort((a,b)=> b[0]-a[0] || a[1]-b[1]);
  if(!hits.length){ root.append(el("p",{class:"empty"},"Geen Pokémon gevonden. Kijk of de naam goed gespeld is.")); return; }
  hits.slice(0,10).forEach(([,n]) => {
    const d = DEX[n-1], alt = [d[1],d[2]].filter(Boolean).join(" · ");
    const dot = el("span",{class:"dot"}); dot.append(icon(types(n)[0]));
    const b = el("button",{class:"res",onclick:()=>openPanel(n,true)}, dot, nameOf(n), has(n) ? el("span",{class:"own"}, "×" + total(n)) : null, el("small",{}, pad(n), alt?el("br"):null, alt||null));
    colorVars(b,n); root.append(b);
  });
}

/* ---------- paneel: kaart erbij ---------- */
let pick = {s:"Gewoon", f:"Normaal", cid:"", img:""}, panelN = 0, fromSearch = false, soortTouched = false, newOpen = false, panelMode = "";
let cardsState = {n:0, status:"idle", list:[]};
function openPanel(n, search){
  document.getElementById("toast").classList.remove("show");
  panelMode = "kaart"; newOpen = false; soortTouched = false; panelN = n; fromSearch = !!search;
  pick = {s:"Gewoon", f:"Normaal", cid:"", img:""};
  renderPanel(); document.getElementById("scrim").hidden = false;
  if(cardsState.n!==n || cardsState.status==="error"){
    cardsState = {n, status:"loading", list:[]};
    loadCards(n).then(list => { if(cardsState.n===n){ cardsState = {n, status:"ok", list}; if(panelN===n) renderCards(); } })
                .catch(() => { if(cardsState.n===n){ cardsState = {n, status:"error", list:[]}; if(panelN===n) renderCards(); } });
  }
}
function closePanel(){ document.getElementById("scrim").hidden = true; panelN = 0; panelMode = ""; if(fromSearch && view==="erbij") document.getElementById("q").focus(); }
function renderCards(){
  const box = document.getElementById("cardsBox"); if(!box) return; box.innerHTML = "";
  if(cardsState.status==="loading"){ box.append(el("div",{class:"loading"},"Kaarten laden…")); return; }
  if(cardsState.status==="error"){ box.append(el("div",{class:"cerr"},"Kaarten laden lukt nu niet. Geen internet? Je kunt hem hieronder ook zonder plaatje toevoegen.")); return; }
  const list = soortTouched ? cardsState.list.filter(c => detectSoort(c.name)===pick.s) : cardsState.list;
  if(list.length) box.append(el("div",{class:"meta"}, el("span",{}, soortTouched ? list.length + " " + pick.s + "-kaarten" : list.length + " kaarten gevonden"), el("span",{}, "tik op jouw kaart")));
  if(!list.length){ box.append(el("div",{class:"cerr"}, cardsState.list.length ? "Geen kaarten van deze soort gevonden. Kies een andere soort of voeg hem zonder plaatje toe." : "Geen kaarten met plaatje gevonden. Voeg hem hieronder zonder plaatje toe.")); return; }
  const g = el("div",{class:"cgrid"});
  list.forEach(c => {
    const img = el("img",{src:c.image + "/low.webp",alt:c.name,loading:"lazy",decoding:"async"});
    const btn = el("button",{class:"cpick","aria-pressed":String(pick.cid===c.id),"aria-label":c.name + " " + c.id,onclick:()=>{
      if(pick.cid===c.id){ pick.cid=""; pick.img=""; } else { pick.cid = c.id; pick.img = c.image; pick.s = detectSoort(c.name); }
      renderPanel(); }}, img);
    img.addEventListener("error", () => { img.remove(); btn.append(el("span",{class:"noimg"}, c.name)); });
    g.append(btn);
  });
  box.append(g);
}
function renderPanel(){
  if(panelMode==="backup") return renderBackup();
  const n = panelN, p = document.getElementById("panel");
  const keepScroll = (document.querySelector("#cardsBox .cgrid")||{}).scrollTop || 0, panelScroll = p.scrollTop;
  p.innerHTML = "";
  const badge = el("div",{class:"badge"}); badge.append(icon(types(n)[0]));
  const head = el("div",{class:"phead"}, badge,
    el("div",{}, el("h3",{}, nameOf(n)), el("p",{}, pad(n) + " uit " + REGIONS[DEX[n-1][3]-1] + ", " + (total(n) ? total(n) + " in je boek" : "nog niet gevangen"))),
    el("button",{class:"close","aria-label":"Sluiten",onclick:closePanel},"×"));
  colorVars(head,n); p.append(head);

  p.append(el("p",{class:"label"},"Welke kaart is het?"), el("div",{class:"cardsbox",id:"cardsBox"}));
  p.append(el("p",{class:"label"}, pick.cid ? "Soort (al ingevuld)" : "Wat voor kaart?"));
  const c1 = el("div",{class:"chips"});
  state.soorten.forEach(s => c1.append(el("button",{class:"chip","aria-pressed":String(pick.s===s),onclick:()=>{ pick.s=s; soortTouched = true; if(pick.cid && cardsState.list.find(c=>c.id===pick.cid && detectSoort(c.name)!==s)){ pick.cid=""; pick.img=""; } renderPanel(); }}, s)));
  c1.append(el("button",{class:"chip add",onclick:()=>{ newOpen = true; renderPanel(); const i = document.getElementById("newSoort"); if(i) i.focus(); }},"+ nieuw"));
  p.append(c1);
  if(newOpen){
    const inp = el("input",{id:"newSoort",class:"newin",maxlength:"16",placeholder:"Bijv. Radiant of Tera","aria-label":"Naam nieuwe soort"});
    inp.addEventListener("keydown", e => { if(e.key==="Enter") saveSoort(); });
    p.append(el("div",{class:"newrow"}, inp, el("button",{class:"chip",onclick:saveSoort},"Bewaar")));
  }
  p.append(el("p",{class:"label"},"Glimt hij?"));
  const c2 = el("div",{class:"chips"});
  AFWERKING.forEach(f => c2.append(el("button",{class:"chip"+(f!=="Normaal"?" holo":""),"aria-pressed":String(pick.f===f),onclick:()=>{pick.f=f; renderPanel();}}, f)));
  p.append(c2, el("button",{class:"big",onclick:()=>add(n,pick.s,pick.f,1,false,pick.cid,pick.img)}, pick.cid ? "Deze kaart erbij" : "Kaart erbij"));

  const m = state.kaarten[n];
  if(m && Object.keys(m).length){
    p.append(el("p",{class:"label"},"Al in je boek"));
    const box = el("div",{class:"owned"});
    Object.entries(m).forEach(([k,v]) => { const pk = parseKey(k);
      const th = pk.cid && state.img[pk.cid] ? el("img",{class:"thumb",src:imgSmall(pk.cid),alt:""}) : null;
      box.append(el("div",{class:"own"}, th, el("span",{class:"what"}, describe(pk), pk.cid ? el("br") : null, pk.cid ? el("small",{style:"color:var(--soft);font-weight:600"}, pk.cid) : null),
        el("button",{class:"step","aria-label":"Eén minder",onclick:()=>add(n,pk.s,pk.f,-1,true,pk.cid)},"−"),
        el("span",{class:"n"}, v),
        el("button",{class:"step","aria-label":"Eén meer",onclick:()=>add(n,pk.s,pk.f,1,true,pk.cid)},"+"))); });
    p.append(box);
  }
  renderCards();
  const g = document.querySelector("#cardsBox .cgrid"); if(g) g.scrollTop = keepScroll;
  p.scrollTop = panelScroll;
}
function saveSoort(){
  const i = document.getElementById("newSoort"); const s = (i ? i.value : "").trim().slice(0,16);
  newOpen = false;
  if(s && !s.includes("|")){ if(!state.soorten.includes(s)){ state.soorten.splice(Math.max(1,state.soorten.length-1), 0, s); save(); } pick.s = s; }
  renderPanel();
}

/* ---------- back-up ---------- */
function openBackup(){ panelMode = "backup"; panelN = 0; renderBackup(); document.getElementById("scrim").hidden = false; }
function renderBackup(){
  const p = document.getElementById("panel"); p.innerHTML = "";
  let last = ""; try{ last = localStorage.getItem(LS_BACKUP) || ""; }catch(e){}
  const head = el("div",{class:"phead",style:"--t1:#25307a;--t2:#161c4a"}, el("div",{}, el("h3",{},"Back-up"), el("p",{}, last ? "Laatste back-up: " + new Date(last).toLocaleDateString("nl-NL") : "Nog geen back-up gemaakt")),
    el("button",{class:"close","aria-label":"Sluiten",onclick:closePanel},"×"));
  p.append(head, el("div",{class:"bk"},
    el("p",{},"De collectie staat alleen in deze browser. Maak af en toe een back-up: wis je de browsergegevens, dan zet je hem daarmee terug."),
    el("button",{class:"big",onclick:exportData},"Back-up downloaden"),
    el("p",{},"Een back-up terugzetten (of de collectie uit de Claude-versie overnemen) vervangt wat er nu in het boek staat."),
    el("button",{class:"big alt",onclick:()=>document.getElementById("importFile").click()},"Back-up terugzetten")));
}
function exportData(){
  const now = new Date();
  const data = JSON.stringify({app:"tijmens-verzamelboek", v:2, exported:now.toISOString(), soorten:state.soorten, kaarten:state.kaarten, img:state.img}, null, 2);
  const url = URL.createObjectURL(new Blob([data], {type:"application/json"}));
  const a = el("a",{href:url, download:"verzamelboek-" + now.toISOString().slice(0,10) + ".json"});
  document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 2000);
  try{ localStorage.setItem(LS_BACKUP, now.toISOString()); }catch(e){}
  renderBackup(); toast("Back-up gedownload");
}
document.getElementById("importFile").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ""; if(!f) return;
  try{
    const o = JSON.parse(await f.text());
    if(!o || typeof o.kaarten!=="object") throw new Error("geen collectie");
    const nieuw = norm(o); let c = 0; for(const n in nieuw.kaarten) c++;
    if(!confirm("Dit vervangt het huidige boek door de back-up met " + c + " Pokémon. Doorgaan?")) return;
    state = nieuw; save(); closePanel(); renderAll(); toast("Back-up teruggezet: " + c + " Pokémon");
  }catch(err){ toast("Dit bestand is geen back-up van het verzamelboek"); }
});

/* ---------- wijzigen ---------- */
let last = null, toastTimer = null;
function change(n,s,f,d,cid,img){
  const k = s + "|" + f + (cid ? "|" + cid : "");
  const m = state.kaarten[n] = state.kaarten[n] || {};
  m[k] = Math.max(0,(m[k]||0) + d); if(!m[k]) delete m[k];
  if(!Object.keys(m).length) delete state.kaarten[n];
  if(cid && img && IMG_OK.test(img)) state.img[cid] = img;
  save();
}
function add(n,s,f,d,stay,cid,img){
  const before = total(n); change(n,s,f,d,cid,img);
  if(d>0){
    last = {n,s,f,cid};
    const msg = nameOf(n) + (s!=="Gewoon"?" " + s:"") + (f!=="Normaal"?" " + f.toLowerCase():"") + (before===0 ? " is gevangen!" : " erbij");
    if(before===0){ reveal(n, f!=="Normaal", s, cid && state.img[cid] ? state.img[cid] + "/high.webp" : ""); pendingMsg = msg; } else toast(msg);
  }
  renderAll();
  if(stay){ renderPanel(); return; }
  closePanel();
  if(view==="erbij"){ const q = document.getElementById("q"); q.value = ""; renderResults(); if(document.getElementById("reveal").hidden) q.focus(); }
  else { const e = document.querySelector('#v-'+view+' .slot[data-n="'+n+'"]'); if(e) e.classList.add("pop"); }
}
function toast(msg){
  const t = document.getElementById("toast"); document.getElementById("toastMsg").textContent = msg;
  document.getElementById("undo").hidden = !last;
  t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("show"), 3500);
}
document.getElementById("undo").addEventListener("click", () => {
  if(!last) return; change(last.n,last.s,last.f,-1,last.cid); last = null;
  document.getElementById("toast").classList.remove("show"); renderAll();
});

/* ---------- onthulling ---------- */
let revealTimer = null, pendingMsg = "";
function reveal(n, shine, s, bigImg){
  const r = document.getElementById("reveal"); r.innerHTML = "";
  let face;
  if(bigImg){
    const im = el("img",{src:bigImg,alt:nameOf(n)});
    face = el("div",{class:"face img"}, im);
  } else {
    const art = el("div",{class:"art"}); art.append(icon(types(n)[0]));
    face = el("div",{class:"face"}, el("div",{class:"fi"}, el("div",{class:"row"}, el("span",{}, pad(n)), el("span",{}, s!=="Gewoon"?s:"")), art, el("div",{class:"nm"}, nameOf(n))));
  }
  const card = el("div",{class:"rcard"+(shine?" shine":"")}, el("div",{class:"rback"}), face);
  colorVars(card,n);
  const conf = el("div",{class:"confetti"});
  const cols = ["#ffcb3d","#7af0ff","#ff8fd0","#7affc1","#b48cff", TYPE[types(n)[0]]];
  for(let i=0;i<40;i++){ conf.append(el("i",{style:`left:${Math.random()*100}%;background:${cols[i%cols.length]};animation-delay:${(Math.random()*0.6).toFixed(2)}s;animation-duration:${(1.8+Math.random()*1.4).toFixed(2)}s`})); }
  r.append(el("div",{class:"rays"}), conf, el("div",{class:"rstack"}, el("div",{class:"rtext"}, nameOf(n) + " gevangen!"), card, el("div",{class:"rsub"},"Tik om verder te gaan")));
  document.getElementById("toast").classList.remove("show");
  r.hidden = false; clearTimeout(revealTimer); revealTimer = setTimeout(closeReveal, 4500);
}
function closeReveal(){ const r = document.getElementById("reveal"); if(r.hidden) return; r.hidden = true; r.innerHTML = ""; clearTimeout(revealTimer);
  if(pendingMsg){ toast(pendingMsg); pendingMsg = ""; }
  if(view==="erbij") document.getElementById("q").focus(); }
document.getElementById("reveal").addEventListener("click", closeReveal);

/* ---------- navigatie ---------- */
function show(v){
  view = v;
  document.querySelectorAll("nav.tabs button").forEach(b => { if(b.dataset.v===v) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  ["boek","erbij","mis","dub"].forEach(x => document.getElementById("v-"+x).hidden = x!==v);
  document.getElementById("regions").style.display = v==="erbij" ? "none" : "";
  renderView(); window.scrollTo(0,0);
  if(v==="erbij") setTimeout(()=>document.getElementById("q").focus(), 50);
}
function renderView(){ if(view==="boek") renderBoek(false); else if(view==="mis") renderBoek(true); else if(view==="dub") renderDub(); else renderResults(); }
function renderAll(){ renderHead(); renderView(); }
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => show(b.dataset.v)));
document.getElementById("q").addEventListener("input", renderResults);
document.getElementById("q").addEventListener("keydown", e => { if(e.key==="Enter"){ const f = document.querySelector("#results .res"); if(f) f.click(); } });
document.getElementById("scrim").addEventListener("click", e => { if(e.target.id==="scrim") closePanel(); });
document.addEventListener("keydown", e => { if(e.key==="Escape"){ if(!document.getElementById("reveal").hidden) closeReveal(); else if(!document.getElementById("scrim").hidden) closePanel(); } });
document.getElementById("backupBtn").addEventListener("click", openBackup);

/* thema */
try{ const t = localStorage.getItem("tvb-theme"); if(t) document.documentElement.dataset.theme = t; }catch(e){}
document.getElementById("themeBtn").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const t = dark ? "light" : "dark"; document.documentElement.dataset.theme = t; try{ localStorage.setItem("tvb-theme", t); }catch(e){}
});

loadLocal(); setStatus("Bewaard op dit apparaat."); renderAll();
